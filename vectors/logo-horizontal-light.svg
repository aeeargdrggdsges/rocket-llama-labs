<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hGrad" x1="10" y1="110" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hFlame" x1="35" y1="85" x2="15" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hInnerFlame" x1="38" y1="86" x2="24" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK (Scaled & Positioned at x: 10, y: 10) -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Exhaust Particles -->
    <circle cx="28" cy="172" r="3.5" fill="#38BDF8" opacity="0.6"/>
    <circle cx="20" cy="182" r="2" fill="#38BDF8" opacity="0.4"/>
    
    <!-- Flame -->
    <path d="M 68 132 C 55 145, 30 162, 28 178 C 42 172, 60 148, 74 138 Z" fill="url(#hFlame)" />
    <path d="M 69 133 C 60 142, 46 154, 42 165 C 51 161, 64 145, 73 137 Z" fill="url(#hInnerFlame)" opacity="0.9"/>

    <!-- Left Wing -->
    <path d="M 60 120 L 40 142 C 38 144, 40 148, 44 147 L 76 138 Z" fill="#1E293B"/>

    <!-- Right Wing -->
    <path d="M 102 78 L 126 56 C 130 52, 134 56, 131 60 L 118 94 Z" fill="#1E40AF"/>

    <!-- Fuselage -->
    <path d="
      M 62 136
      C 56 122, 62 104, 74 86
      L 98 52
      C 102 46, 108 42, 115 42
      C 122 42, 128 47, 131 54
      C 134 60, 132 68, 126 74
      L 116 84
      C 106 94, 98 110, 92 126
      C 90 130, 86 133, 81 133
      L 65 137
      C 63 137, 62 137, 62 136 Z
    " fill="url(#hGrad)"/>

    <!-- Ears -->
    <path d="M 112 40 L 124 16 C 126 12, 131 14, 130 18 L 122 38 Z" fill="#1D4ED8"/>
    <path d="M 118 44 L 136 20 C 138 16, 143 19, 141 24 L 127 48 Z" fill="#38BDF8"/>

    <!-- Eye & Details -->
    <circle cx="121" cy="56" r="4.5" fill="#0F172A"/>
    <circle cx="122.5" cy="54.5" r="1.5" fill="#FFFFFF"/>
    <path d="M 128 62 C 126 64, 123 65, 120 64" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 82 108 L 94 92" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- TYPOGRAPHY FOR LIGHT BACKGROUND -->
  <!-- "ROCKET LLAMA" -->
  <text x="125" y="62" font-family="'Inter', 'Outfit', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.02em" fill="#0F172A">
    ROCKET LLAMA
  </text>

  <!-- "LABS" Badge / Pill -->
  <rect x="420" y="38" width="82" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="461" y="57" font-family="'Inter', 'JetBrains Mono', sans-serif" font-weight="700" font-size="14" letter-spacing="0.18em" fill="#2563EB" text-anchor="middle">
    LABS
  </text>

  <!-- Subtitle: Home-Service Marketing -->
  <text x="126" y="86" font-family="'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="0.14em" fill="#64748B">
    HOME-SERVICE GROWTH ENGINE
  </text>
  <circle cx="340" cy="82" r="2" fill="#2563EB"/>
  <text x="352" y="86" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#94A3B8">
    MORE QUALIFIED LEADS
  </text>
</svg>
