<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radial / Linear Gradients -->
    <linearGradient id="c2MainBlue" x1="100" y1="180" x2="100" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="c2Cyan" x1="100" y1="190" x2="100" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="c2Wing" x1="40" y1="160" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Group centered at 100,100 -->
  <g>
    <!-- Exhaust Plume / Rocket Flame -->
    <path d="M 85 142 C 85 168, 100 188, 100 188 C 100 188, 115 168, 115 142 Z" fill="url(#c2Cyan)"/>
    <path d="M 92 142 C 92 158, 100 172, 100 172 C 100 172, 108 158, 108 142 Z" fill="#FFFFFF"/>

    <!-- Left & Right Delta Wings / Base Stabilizers -->
    <path d="M 68 120 L 46 148 C 44 150, 48 154, 52 153 L 80 144 Z" fill="url(#c2Wing)"/>
    <path d="M 132 120 L 154 148 C 156 150, 152 154, 148 153 L 120 144 Z" fill="url(#c2Wing)"/>

    <!-- Symmetrical Rocket Fuselage -->
    <path d="
      M 74 142
      C 72 124, 76 95, 82 72
      L 82 50
      C 82 40, 90 32, 100 32
      C 110 32, 118 40, 118 50
      L 118 72
      C 124 95, 128 124, 126 142
      Z
    " fill="url(#c2MainBlue)"/>

    <!-- Llama Ears (Upward Aerodynamic Twin Nose-Fins) -->
    <!-- Left Ear -->
    <path d="M 86 42 L 78 16 C 77 12, 83 11, 86 15 L 94 36 Z" fill="#2563EB"/>
    <path d="M 86 38 L 81 22 C 80 20, 84 19, 86 21 L 91 34 Z" fill="#38BDF8"/>

    <!-- Right Ear -->
    <path d="M 114 42 L 122 16 C 123 12, 117 11, 114 15 L 106 36 Z" fill="#38BDF8"/>
    <path d="M 114 38 L 119 22 C 120 20, 116 19, 114 21 L 109 34 Z" fill="#FFFFFF"/>

    <!-- Face Details (Geometric, Sleek, Friendly) -->
    <!-- Llama Eyes -->
    <circle cx="91" cy="54" r="3.5" fill="#0F172A"/>
    <circle cx="92" cy="53" r="1.2" fill="#FFFFFF"/>
    <circle cx="109" cy="54" r="3.5" fill="#0F172A"/>
    <circle cx="110" cy="53" r="1.2" fill="#FFFFFF"/>

    <!-- Muzzle / Snout (Porthole Inspired) -->
    <ellipse cx="100" cy="66" rx="10" ry="7.5" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 97 65 C 99 67, 101 67, 103 65" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="100" cy="62" r="1.5" fill="#0F172A"/>

    <!-- Rocket Section Band / Girth Line -->
    <path d="M 80 94 C 93 97, 107 97, 120 94" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Upward Growth Arrow (Home-Service Lead Acceleration) -->
    <path d="M 100 118 L 100 102 M 95 107 L 100 102 L 105 107" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
